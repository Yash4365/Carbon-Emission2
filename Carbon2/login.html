<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - EcoTrace Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card rounded-3xl p-8 border border-slate-800 shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center">
            <a href="index.html" class="text-2xl font-black text-emerald-400 inline-block mb-2"><i class="fa-solid fa-leaf mr-2"></i>EcoTrace Pro</a>
            <h2 class="text-xl font-bold text-white">Sign In to Account</h2>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-400">Email Address</label>
                <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white mt-1 outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white mt-1 outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black py-3 rounded-xl transition">
                Sign In
            </button>
        </form>
    </div>

    <script>
        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            localStorage.setItem('ecotrace_user', JSON.stringify({ email, name: email.split('@')[0] }));
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
