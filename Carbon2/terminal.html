<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Terminal Inspector - EcoTrace Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <nav class="bg-slate-900 border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-black text-emerald-400"><i class="fa-solid fa-leaf mr-2"></i>EcoTrace Pro</a>
            <div class="space-x-4 text-sm font-semibold text-slate-300">
                <a href="index.html">Home</a>
                <a href="calculator.html">Calculator</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="terminal.html" class="text-emerald-400">API Terminal</a>
                <a href="database.html">Database</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto p-6 md:p-8 space-y-6">
        <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-black text-white"><i class="fa-solid fa-terminal text-emerald-400 mr-2"></i>Express API Request Inspector</h2>
                <p class="text-slate-400 text-sm mt-1">Simulates server request logs, headers, and status codes.</p>
            </div>
            <button onclick="clearTerminal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold text-slate-300 border border-slate-700">
                <i class="fa-solid fa-broom mr-1"></i> Clear Log
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Controls -->
            <div class="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-paper-plane text-cyan-400 mr-2"></i>Test Endpoint</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 font-bold">Select Endpoint</label>
                        <select id="endpointSelect" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-white mt-1">
                            <option value="GET /api/v1/carbon/logs">GET /api/v1/carbon/logs</option>
                            <option value="GET /api/v1/health">GET /api/v1/health</option>
                        </select>
                    </div>
                    <button onclick="sendTestRequest()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-xl transition">
                        Dispatch Request
                    </button>
                </div>
            </div>

            <!-- Output Screen -->
            <div class="lg:col-span-2 glass-card p-6 rounded-2xl border border-slate-800 space-y-3">
                <div class="flex items-center space-x-2 border-b border-slate-800 pb-3">
                    <span class="w-3 h-3 rounded-full bg-rose-500"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                    <span class="text-xs font-mono text-slate-400 ml-2">server-terminal@localhost:5000</span>
                </div>
                <div id="terminalScreen" class="bg-slate-950 p-4 rounded-xl text-emerald-400 font-mono text-xs h-72 overflow-y-auto space-y-2 border border-slate-800">
                    <p class="text-slate-500">// Express Server REST API Logger Ready...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api-client.js"></script>
    <script>
        async function sendTestRequest() {
            const endpoint = document.getElementById('endpointSelect').value;
            const screen = document.getElementById('terminalScreen');
            
            const logItem = document.createElement('div');
            logItem.className = "border-b border-slate-900 pb-2 mb-2";
            logItem.innerHTML = `<span class="text-slate-500">[${new Date().toLocaleTimeString()}]</span> <span class="text-cyan-400 font-bold">${endpoint}</span> - <span class="text-emerald-400">200 OK</span>`;
            
            screen.appendChild(logItem);
            screen.scrollTop = screen.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminalScreen').innerHTML = `<p class="text-slate-500">// Terminal Log Cleared...</p>`;
        }
    </script>
</body>
</html>
