<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Inspector - EcoTrace Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <nav class="bg-slate-900 border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-black text-emerald-400"><i class="fa-solid fa-leaf mr-2"></i>EcoTrace Pro</a>
            <div class="space-x-4 text-sm font-semibold text-slate-300">
                <a href="index.html">Home</a>
                <a href="calculator.html">Calculator</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="database.html" class="text-emerald-400">Database</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto p-6 md:p-8 space-y-6">
        <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-2xl font-black text-white"><i class="fa-solid fa-database text-cyan-400 mr-2"></i>Database Collection Inspector</h2>
            <p class="text-slate-400 text-sm mt-1">Live MongoDB / MySQL raw JSON document records stored in system state.</p>
        </div>

        <div class="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <span class="font-mono text-xs text-amber-400 font-bold"><i class="fa-solid fa-table mr-2"></i>Collection: carbon_emission_logs</span>
                <button onclick="loadDbView()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-emerald-400 font-bold">Refresh View</button>
            </div>
            <pre id="jsonDbView" class="bg-slate-950 p-4 rounded-xl font-mono text-xs text-teal-300 overflow-x-auto h-80 border border-slate-800">
// Fetching Database Records...
            </pre>
        </div>
    </main>

    <script src="js/api-client.js"></script>
    <script>
        async function loadDbView() {
            const res = await ApiClient.fetchLogs();
            document.getElementById('jsonDbView').innerText = JSON.stringify(res.data || res.records || res, null, 2);
        }
        document.addEventListener('DOMContentLoaded', loadDbView);
    </script>
</body>
</html>
