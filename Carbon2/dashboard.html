<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - EcoTrace Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-black text-emerald-400 flex items-center">
                <i class="fa-solid fa-leaf mr-2"></i>EcoTrace Pro
            </a>
            <div class="space-x-4 text-sm font-semibold text-slate-300">
                <a href="index.html">Home</a>
                <a href="calculator.html">Calculator</a>
                <a href="dashboard.html" class="text-emerald-400">Dashboard</a>
                <a href="terminal.html">API Terminal</a>
                <a href="database.html">Database</a>
                <a href="action.html">Roadmap</a>
                <a href="college.html">College Docs</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-6 md:p-8 space-y-8">
        <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
                <h2 class="text-3xl font-black text-white flex items-center">
                    <i class="fa-solid fa-chart-pie text-emerald-400 mr-3"></i>Emissions Analytics Dashboard
                </h2>
                <p class="text-slate-400 text-sm mt-1">Real-time data visualization driven by Chart.js & Backend REST APIs.</p>
            </div>
        </div>

        <!-- Analytics Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Doughnut Chart Card -->
            <div class="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="font-bold text-white text-base flex items-center">
                    <i class="fa-solid fa-chart-pie text-emerald-400 mr-2"></i>Category Emissions Breakdown
                </h3>
                <div class="relative h-64 flex items-center justify-center">
                    <canvas id="doughnutChart"></canvas>
                </div>
            </div>

            <!-- Bar Chart Card -->
            <div class="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="font-bold text-white text-base flex items-center">
                    <i class="fa-solid fa-chart-column text-teal-400 mr-2"></i>Historical Emission Log Trend
                </h3>
                <div class="relative h-64 flex items-center justify-center">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api-client.js"></script>
    <script src="js/charts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const result = await ApiClient.fetchLogs();
            initDashboardCharts(null, result.data || result.records);
        });
    </script>
</body>
</html>
